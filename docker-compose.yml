services:
  store:
    build: .
    ports:
      - "3000:3000"
    # Copy .env.example to .env and edit it. Values there are passed to the container.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/ember-oak.db
      # Variables worth setting in .env for a real store:
      #   DEMO_MODE=false, ADMIN_EMAIL, ADMIN_PASSWORD, COOKIE_SECURE=true (behind HTTPS), TRUST_PROXY=true (behind a proxy)
      # For a demo copy: DEMO_MODE=true and set DEMO_ADMIN_PASSWORD / DEMO_CUSTOMER_PASSWORD (and SESSION_SECRET).
    volumes:
      - store-data:/data
    restart: unless-stopped

volumes:
  store-data:
